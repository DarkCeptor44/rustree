[package]
name = "rustree"
version = "0.1.0"
description = "A Rust implementation of the tree command"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
colored = "3.1.1"
ignore = { version = "0.4.34", features = ["simd-accel"] }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap"]

[[bin]]
name = "rustree"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.playground]
all-features = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
incremental = false

[profile.fast]
inherits = "release"
lto = false
