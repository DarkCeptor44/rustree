[package]
name = "rustree"
version = "0.1.0"
description = "A Rust implementation of the tree command"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossbeam = "0.8.5"
ignore = { version = "0.4.34", features = ["simd-accel"] }
